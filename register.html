<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - StudentHub</title><link rel="stylesheet" href="css/styles.css"></head><body><div class="auth-shell"><div class="auth-card"><a class="logo" href="index.html"><div class="logo-badge">SH</div>Student<span>Hub</span></a><span class="eyebrow" style="margin-top:22px">CREATE ACCOUNT</span><h1>Join StudentHub</h1><p class="muted">Students and external clients can join. Gig posting requires identity verification.</p><div id="msg" class="notice error"></div><form id="registerForm"><div class="field"><label>Full Name</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Account Type</label><select id="accountType" required><option value="student">Student</option><option value="client">Non-student / Client</option></select></div><div class="field" id="departmentField"><label>Department / Program</label><input id="department" placeholder="CSE, BBA, EEE..."></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div><button class="btn btn-primary" style="width:100%">Create Account</button></form><p class="login-links">Already have an account? <a href="login.html"><b>Login</b></a></p></div></div><script>accountType.onchange=()=>departmentField.style.display=accountType.value==='student'?'block':'none';</script><script src="js/app.js"></script><script src="js/register.js"></script></body></html>
